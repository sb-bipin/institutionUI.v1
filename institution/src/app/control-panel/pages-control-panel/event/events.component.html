<div class="container my-5">
    <!-- Header with Create button -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h1 class="display-5 fw-bold">📅 Events</h1>
        <button class="btn btn-primary btn-lg" (click)="openCreateModal()">
            <i class="fas fa-plus-circle me-2"></i>Create Event
        </button>
    </div>

    <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div *ngIf="!loading && events.length === 0" class="alert alert-info text-center">
        No events found. Click "Create Event" to add one.
    </div>

    <div class="row g-4">
        <div class="col-sm-12 col-md-6 col-lg-4" *ngFor="let event of events">
            <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden transition-hover">
                <img [src]="event.imageUrl || 'assets/images/placeholder.jpg'" class="card-img-top"
                    style="height: 200px; object-fit: cover;" alt="{{ event.title }}">
                <div class="card-body">
                    <h5 class="card-title fw-bold">{{ event.title }}</h5>
                    <p class="card-text text-muted">{{ event.description | slice:0:100 }}...</p>
                    <div class="d-flex flex-column gap-2 small mb-3">
                        <span><i class="fas fa-calendar-alt text-primary me-2"></i>{{ event.date | date:'fullDate'
                            }}</span>
                        <span><i class="fas fa-clock text-primary me-2"></i>{{ event.time }}</span>
                        <span><i class="fas fa-location-dot text-primary me-2"></i>{{ event.location }}</span>
                        <span><i class="fas fa-user-tie text-primary me-2"></i>{{ event.organizer }}</span>
                    </div>
                </div>
                <div class="card-footer bg-white border-0 pb-3 d-flex justify-content-between">
                    <button (click)="openEditModal(event)" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-edit me-1"></i>Edit
                    </button>
                    <button (click)="deleteEvent(event.id, event.title)" class="btn btn-outline-danger btn-sm">
                        <i class="fas fa-trash-alt me-1"></i>Delete
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content rounded-4 shadow">
            <div class="modal-header bg-primary text-white rounded-top-4">
                <h5 class="modal-title" id="eventModalLabel">
                    {{ isEditMode ? 'Edit Event' : 'Create New Event' }}
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form [formGroup]="eventForm" (ngSubmit)="onSubmit()">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Title</label>
                        <input type="text" formControlName="title" class="form-control"
                            placeholder="Annual Tech Summit">
                        <div class="invalid-feedback"
                            *ngIf="eventForm.get('title')?.invalid && eventForm.get('title')?.touched">
                            Title is required.
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Description</label>
                        <textarea rows="3" formControlName="description" class="form-control"
                            placeholder="Event description..."></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Date</label>
                            <input type="date" formControlName="date" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Time</label>
                            <input type="text" formControlName="time" class="form-control"
                                placeholder="9:00 AM - 5:00 PM">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Location</label>
                        <input type="text" formControlName="location" class="form-control"
                            placeholder="Main Auditorium">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Organizer</label>
                        <input type="text" formControlName="organizer" class="form-control"
                            placeholder="Tech Department">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Event Image</label>
                        <input type="file" (change)="onImageSelected($event)" class="form-control" accept="image/*">
                        <div *ngIf="imagePreview" class="mt-3 text-center">
                            <img [src]="imagePreview" class="img-thumbnail" style="max-height: 200px;">
                        </div>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary px-4" [disabled]="formSubmitting">
                            <span *ngIf="formSubmitting" class="spinner-border spinner-border-sm me-2"></span>
                            {{ isEditMode ? 'Update' : 'Create' }} Event
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
