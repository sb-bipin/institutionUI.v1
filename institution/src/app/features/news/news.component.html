<div class="news-container">

    <div class="section-header text-center mb-4">
        <h2 class="section-title">📰 Latest News & Updates</h2>
        <p class="section-subtitle">
            Stay informed about the latest developments in our educational community
        </p>
    </div>

    <div class="news-grid">
        <article *ngFor="let news of newsItems" class="news-card">
            <div class="news-image">
                <img [src]="news.imageUrl" [alt]="news.title" loading="lazy">
            </div>

            <div class="news-content">
                <div class="news-meta">
                    <span class="author">{{ news.author }}</span>
                    <span class="separator">•</span>
                    <span class="date">{{ formatDate(news.publishDate) }}</span>
                </div>

                <h2 class="news-heading">{{ news.title }}</h2>
                <p class="news-excerpt">{{ news.description }}</p>

                <button class="read-more-btn">
                    Read More
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
        </article>
    </div>

</div>
