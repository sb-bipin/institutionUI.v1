<section class="notice-section">
    <div class="container">

        <div class="section-header text-center mb-4">
            <h2 class="section-title">📢 Latest Notices</h2>
            <p class="section-subtitle">Stay updated with college announcements</p>
        </div>

        <div class="row g-4">
            <div class="col-lg-4 col-md-6" *ngFor="let notice of notices">
                <div class="notice-card" [class.important]="notice.important" (click)="openNotice(notice)">

                    <div class="notice-date">
                        {{ notice.date | easyDate }}
                    </div>

                    <h5 class="notice-title">{{ notice.title }}</h5>

                    <p class="notice-desc">{{ notice.description }}</p>

                    <span *ngIf="notice.important" class="badge bg-danger">
                        Important
                    </span>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="custom-modal" *ngIf="selectedNotice" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">

        <button class="close-btn" (click)="closeModal()">✕</button>

        <h5 class="modal-title">{{ selectedNotice.title }}</h5>

        <img [src]="selectedNotice.imageUrl" alt="Notice Image" class="img-fluid rounded" />
    </div>
</div>
