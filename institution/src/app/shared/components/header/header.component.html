<header class="main-header" [ngClass]="{ 'sticky-header': isSticky }">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid px-2 px-lg-4">

            <a class="navbar-brand d-flex align-items-center py-2" routerLink="/home">
                <img src="assets/images/Logo.jpg" alt="NWA College" class="logo-img img-fluid" />
            </a>

            <button class="navbar-toggler border-0" type="button" (click)="toggleMenu()"
                [attr.aria-expanded]="isMenuOpen" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" [ngClass]="{ show: isMenuOpen }">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">

                    <li class="nav-item">
                        <a class="nav-link" routerLink="/home" routerLinkActive="active"
                            [routerLinkActiveOptions]="{ exact: true }">
                            Home
                        </a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" role="button" (click)="toggleDropdown($event)">
                            About Us
                        </a>

                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" routerLink="/about">Nepal Western Academy</a></li>
                            <li><a class="dropdown-item" routerLink="messages-from-leaders">Messages From Leaders</a>
                            </li>
                        </ul>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" role="button" (click)="toggleDropdown($event)">
                            Programs
                        </a>
                        <ul class="dropdown-menu" appendTo="body">
                            <li><a class="dropdown-item" routerLink="/programs/bba">BBA</a></li>
                            <li><a class="dropdown-item" routerLink="/programs/bba-f">BBA – Finance</a></li>
                            <li><a class="dropdown-item" routerLink="/programs/bhm">BHM</a></li>
                        </ul>
                    </li>

                    <li class="nav-item"><a class="nav-link" routerLink="/notice">Notice</a></li>
                    <li class="nav-item"><a class="nav-link text-tertiary fw-bold" routerLink="/admission">Admission</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" routerLink="/news">News</a></li>
                    <li class="nav-item"><a class="nav-link" routerLink="/events">Events</a></li>
                    <li class="nav-item"><a class="nav-link" routerLink="/gallery">Image Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" routerLink="/contact">Contact</a></li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-danger" role="button" (click)="toggleDropdown($event)">
                            Downloads
                        </a>

                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a class="dropdown-item" target="_blank"
                                    href="https://play.google.com/store/apps/details?id=com.fest.erpapp_nwa&pcampaignid=web_share">
                                    <i class="fab fa-android text-success me-2"></i> Download App
                                </a>
                            </li>

                            <li>
                                <hr class="dropdown-divider">
                            </li>

                            <a class="dropdown-item" routerLink="/questions">Question Bank</a>

                        </ul>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
</header>
