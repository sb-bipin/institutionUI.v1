<button class="cp-sidebar__overlay" (click)="toggleSidebar()" [class.visible]="isMobileOpen"></button>

<nav class="cp-sidebar" [class.collapsed]="isCollapsed" [class.mobile-open]="isMobileOpen">

    <div class="cp-sidebar__brand">
        <div class="cp-sidebar__brand-icon">
            <i class="fa-solid fa-table-cells"></i>
        </div>
        <span class="cp-sidebar__brand-label">Control Panel</span>
        <button class="cp-sidebar__toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
    </div>

    <ul class="cp-sidebar__nav">
        @for (item of navItems; track item.route) {
        @if (item.divider) {
        <li class="cp-sidebar__divider"></li>
        }
        <li>
            <a [routerLink]="item.route" routerLinkActive="active" class="cp-sidebar__link"
                [title]="isCollapsed ? item.label : ''">
                <span class="cp-sidebar__icon">
                    <i [class]="item.faIcon"></i>
                </span>
                <span class="cp-sidebar__label">{{ item.label }}</span>
            </a>
        </li>
        }
    </ul>

    <!-- <div class="cp-sidebar__footer">
        <div class="cp-sidebar__user" [title]="isCollapsed ? 'Arun K.' : ''">
            <div class="cp-sidebar__avatar">AK</div>
            <div class="cp-sidebar__user-info">
                <span class="cp-sidebar__user-name">Arun K.</span>
                <span class="cp-sidebar__user-role">Admin</span>
            </div>
        </div>
    </div> -->

</nav>
